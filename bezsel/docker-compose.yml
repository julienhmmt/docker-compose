---

x-common: &x-common
  privileged: false
  volumes:
    - /etc/localtime:/etc/localtime:ro
  security_opt:
    - no-new-privileges=true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
  ulimits:
    nproc: 6144
    nofile:
      soft: 6000
      hard: 12000

services:
  dockerproxy:
    image: tecnativa/docker-socket-proxy:edge
    <<: *x-common
    restart: always
    container_name: dockerproxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LOG_LEVEL: info
      # 0 to revoke access / 1 to grant access.
      ## Granted by Default
      EVENTS: 1
      PING: 1
      VERSION: 1
      ## Revoked by Default
      # Security critical
      AUTH: 0
      SECRETS: 0
      # Not always needed
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      CONTAINERS: 1 # Traefik, portainer, etc.
      DISTRIBUTION: 0
      EXEC: 0
      IMAGES: 1 # Portainer
      INFO: 1 # Portainer
      NETWORKS: 1 # Portainer
      NODES: 0
      PLUGINS: 0
      SERVICES: 1 # Portainer
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 1 # Portainer
      VOLUMES: 1 # Portainer
      TZ: "Europe/Paris"
    mem_limit: 64m
    mem_reservation: 32m

  beszel:
    <<: *x-common
    image: henrygd/beszel:0.17
    container_name: beszel
    restart: unless-stopped
    volumes:
      - data_beszel:/beszel_data

  beszel-agent:
    <<: *x-common
    image: henrygd/beszel-agent:0.17
    container_name: beszel-agent
    restart: unless-stopped
    environment:
      DOCKER_HOST: tcp://dockerproxy:2375
      LOG_LEVEL: info
      # NICS: eth0 
      MEM_CALC: htop 
      PORT: 45876
      # Do not remove quotes around the key
      KEY: 'changeme'

volumes:
  data_beszel:
  # data_agent_beszel:

---

x-common: &x-common
  privileged: false
  volumes:
    - /etc/localtime:/etc/localtime:ro
  security_opt:
    - no-new-privileges=true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
  ulimits:
    nproc: 6144
    nofile:
      soft: 6000
      hard: 12000

services:
  dockerproxy:
    <<: *x-common
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: always
    container_name: dockerproxy
    networks:
      - dockerproxynet
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LOG_LEVEL: info
      # 0 to revoke access / 1 to grant access.
      EVENTS: 1
      PING: 1
      VERSION: 1
      AUTH: 0
      SECRETS: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      CONTAINERS: 1
      DISTRIBUTION: 0
      EXEC: 0
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
      NODES: 0
      PLUGINS: 0
      SERVICES: 1
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 1
      VOLUMES: 1
      TZ: "Europe/Paris"

  traefik:
    image: traefik:langres
    restart: unless-stopped
    container_name: traefik
    networks:
      - dockerproxynet
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - ./conf/acme.json:/acme.json
      - ./conf/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./conf/traefikdynamic:/etc/traefik/dynamic:ro
      - ./logs/traefik.log:/etc/traefik/applog.log
      - /etc/localtime:/etc/localtime:ro
      #- /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TZ: "Europe/Paris"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    mem_reservation: 128m
    depends_on:
      - dockerproxy

  plausible_db:
    image: postgres:18-alpine
    container_name: plausible_db
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql
      - /etc/localtime:/etc/localtime:ro
    environment:
      POSTGRES_USER: plausibledbuser
      POSTGRES_PASSWORD: plausibledbpassword
      POSTGRES_DB: plausibledb
      TZ: Europe/Paris
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plausibledbuser -d plausibledb"]
      start_period: 1m

  plausible_events_db:
    image: clickhouse/clickhouse-server:26.3-alpine
    container_name: plausible_events_db
    restart: unless-stopped
    volumes:
      - event-data:/var/lib/clickhouse
      - ./clickhouse/clickhouse-config.xml:/etc/clickhouse-server/config.d/logging.xml:ro
      - ./clickhouse/clickhouse-user-config.xml:/etc/clickhouse-server/users.d/logging.xml:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
      TZ: Europe/Paris
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      start_period: 1m

  plausible:
    image: ghcr.io/plausible/community-edition:v3.2.1
    container_name: plausible
    restart: unless-stopped
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      plausible_db:
        condition: service_healthy
      plausible_events_db:
        condition: service_healthy
    env_file:
      - plausible-conf.env
    volumes:
      - plausible-data:/var/lib/plausible
      - /etc/localtime:/etc/localtime:ro
    environment:
      TMPDIR: /var/lib/plausible/tmp
      TZ: Europe/Paris
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

volumes:
  db-data:
    driver: local
  event-data:
    driver: local
  geoip:
    driver: local
  plausible-data:
    driver: local

networks:
  dockerproxynet:
    name: dockerproxynet
    ipam:
      config:
        - subnet: 172.16.10.0/24
